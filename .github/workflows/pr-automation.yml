name: PR Automation

on:
  pull_request:
    # synchronize: re-label when new commits change which paths are touched
    types: [opened, edited, reopened, synchronize]

jobs:
  auto-assign-and-label:
    name: Auto-assign and Label PR
    # Fork PRs get a read-only token, so these writes would fail
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
      contents: read

    steps:
      - name: Auto-assign PR creator
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            if (pr.assignees.length > 0) {
              console.log('PR already has assignees; leaving them as-is');
              return;
            }
            try {
              await github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                assignees: [pr.user.login],
              });
              console.log(`Assigned PR to ${pr.user.login}`);
            } catch (error) {
              // Bots (e.g. dependabot) cannot be assigned; keep going to labels
              console.error(`Failed to auto-assign PR creator: ${error.message}`);
            }

      - name: Label from PR title and changed files
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            const labels = new Set();

            // Conventional commit prefix, with optional scope and "!":
            // "fix: ...", "feat(syntax): ...", "refactor!: ..."
            const prefixLabels = {
              fix: 'bug',
              feat: 'enhancement',
              docs: 'documentation',
              chore: 'chore',
              refactor: 'refactor',
              test: 'testing',
              style: 'style',
              perf: 'performance',
              ci: 'ci/cd',
              build: 'build',
            };
            const prefix = pr.title.toLowerCase().match(/^(\w+)(\([^)]*\))?!?:/);
            if (prefix && prefixLabels[prefix[1]]) {
              labels.add(prefixLabels[prefix[1]]);
            }

            // Paths touched by the PR
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });
            const paths = files.map(f => f.filename);
            const touches = test => paths.some(test);

            if (touches(p => p.startsWith('syntax/'))) labels.add('syntax');
            if (touches(p => /^(plugin|ftplugin|autoload)\//.test(p))) labels.add('plugin');
            if (touches(p => p.startsWith('tests/'))) labels.add('testing');
            if (touches(p => p.startsWith('.github/'))) labels.add('ci/cd');
            if (touches(p => p.startsWith('doc/') || p.endsWith('.md'))) labels.add('documentation');

            if (labels.size === 0) {
              console.log('No labels to add');
              return;
            }

            // Create any label that doesn't exist yet
            const colors = {
              'bug': 'd73a4a',
              'enhancement': 'a2eeef',
              'documentation': '0075ca',
              'chore': 'fef2c0',
              'refactor': 'c5def5',
              'testing': '5319e7',
              'style': 'fbca04',
              'performance': '7057ff',
              'ci/cd': 'e99695',
              'build': 'bfdadc',
              'syntax': '1d76db',
              'plugin': 'd4c5f9',
            };
            for (const name of labels) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name,
                });
              } catch (e) {
                if (e.status !== 404) {
                  console.error(`Error checking label '${name}': ${e.message}`);
                  continue;
                }
                try {
                  await github.rest.issues.createLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name,
                    color: colors[name] || 'ededed',
                  });
                  console.log(`Created label: ${name}`);
                } catch (createError) {
                  console.error(`Failed to create label '${name}': ${createError.message}`);
                }
              }
            }

            // addLabels only adds, so labels applied by hand are kept
            const labelArray = [...labels];
            console.log(`Adding labels: ${labelArray.join(', ')}`);
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              labels: labelArray,
            });
